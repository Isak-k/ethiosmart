    <!-- Hide Vercel Toolbar on Mobile Screen -->
    <style>
      @media (max-width: 768px) {
        vercel-live-feedback,
        vercel-toolbar,
        #vercel-toolbar,
        #vercel-live-feedback-host,
        [data-vercel-toolbar],
        [data-testid="vercel-toolbar"],
        [id*="vercel-live-feedback"],
        [class*="vercel-toolbar"],
        iframe[src*="vercel.live"],
        iframe[title*="Vercel"] {
          display: none !important;
          visibility: hidden !important;
          opacity: 0 !important;
          pointer-events: none !important;
          width: 0 !important;
          height: 0 !important;
          position: absolute !important;
          left: -9999px !important;
          bottom: -9999px !important;
          z-index: -9999 !important;
        }
      }
    </style>
    <script>
      (function() {
        function checkAndHideVercelToolbar() {
          var isMobileScreen = window.innerWidth <= 768 || /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
          if (isMobileScreen) {
            var selectors = [
              'vercel-live-feedback',
              'vercel-toolbar',
              '#vercel-toolbar',
              '#vercel-live-feedback-host',
              '[data-vercel-toolbar]',
              '[data-testid="vercel-toolbar"]',
              'iframe[src*="vercel.live"]'
            ];
            selectors.forEach(function(sel) {
              var elements = document.querySelectorAll(sel);
              for (var i = 0; i < elements.length; i++) {
                elements[i].style.setProperty('display', 'none', 'important');
                elements[i].style.setProperty('visibility', 'hidden', 'important');
                elements[i].style.setProperty('pointer-events', 'none', 'important');
              }
            });
          }
        }

        if (typeof window !== 'undefined') {
          window.addEventListener('DOMContentLoaded', checkAndHideVercelToolbar);
          window.addEventListener('load', checkAndHideVercelToolbar);
          window.addEventListener('resize', checkAndHideVercelToolbar);

          if (typeof MutationObserver !== 'undefined') {
            var observer = new MutationObserver(function() {
              checkAndHideVercelToolbar();
            });
            observer.observe(document.documentElement, { childList: true, subtree: true });
          }
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
